*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--texto);font:400 14.5px/1.5 var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mar);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}

/* Fondo: aurora lenta + rejilla de mando */
.fondo{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.fondo i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.fondo i:nth-child(1){width:62vmax;height:62vmax;left:-18vmax;top:-26vmax;background:var(--aur1);animation:d1 26s ease-in-out infinite alternate}
.fondo i:nth-child(2){width:46vmax;height:46vmax;right:-14vmax;top:8vmax;background:var(--aur2);animation:d2 32s ease-in-out infinite alternate}
.fondo i:nth-child(3){width:52vmax;height:52vmax;left:22vmax;bottom:-30vmax;background:var(--aur3);animation:d3 36s ease-in-out infinite alternate}
.fondo::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--rejilla) 1px,transparent 1px),linear-gradient(90deg,var(--rejilla) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000,transparent 75%)}
@keyframes d1{to{transform:translate(14vmax,9vmax) scale(1.18)}}
@keyframes d2{to{transform:translate(-12vmax,10vmax) scale(.9)}}
@keyframes d3{to{transform:translate(-10vmax,-8vmax) scale(1.12)}}

/* Barra superior */
.barra{position:sticky;top:0;z-index:30;background:var(--barra);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--borde)}
.barra-in{max-width:1260px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mar),var(--mar2) 55%,#2B4DFF);box-shadow:0 8px 24px -8px var(--mar2)}
.logo-ico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo small{display:block;color:var(--texto2);font-size:12px;line-height:1.1}
.logo h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.logo-marca{width:58px;height:53px;flex:0 0 auto;background:var(--logo-marca) center/contain no-repeat;filter:drop-shadow(0 6px 16px rgba(15,163,177,.35))}
.logo-completo{width:min(100%,var(--lw,190px));aspect-ratio:652/614;background:var(--logo-completo) center/contain no-repeat;margin:0 auto}
.cargando .logo-completo{--lw:180px;margin-bottom:16px;animation:latido 2.4s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.04);opacity:.82}}
.firma{margin-top:26px;text-align:center;opacity:.92}
.pulso{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--vidrio);border:1px solid var(--borde);font-size:13px}
.pulso i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pulso i::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:onda 2.4s ease-out infinite}
.pulso small{color:var(--texto2);font-variant-numeric:tabular-nums;min-width:34px}
@keyframes onda{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.5);opacity:0}}
select,.ib{background:var(--vidrio);border:1px solid var(--borde);border-radius:10px;padding:8px 12px;cursor:pointer}
select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--texto2) 50%),linear-gradient(135deg,var(--texto2) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:#0B1A21;color:#E9F2F1}
.ib{display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:background .2s,transform .2s}
.ib:hover{background:var(--vidrio2)} .ib:active{transform:scale(.97)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.giro svg{animation:gira .8s linear}
@keyframes gira{to{transform:rotate(360deg)}}

.wrap{max-width:1260px;margin:0 auto;padding:18px 20px 60px}

/* Pestañas con indicador deslizante */
.tabs{position:relative;display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--vidrio);border:1px solid var(--borde);margin-bottom:16px}
.tab{position:relative;z-index:1;background:none;border:0;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--texto2);transition:color .25s}
.tab[aria-selected="true"]{color:var(--texto)}
.ind{position:absolute;z-index:0;left:0;top:4px;bottom:4px;border-radius:10px;background:var(--vidrio2);box-shadow:inset 0 0 0 1px var(--borde),0 6px 18px -8px rgba(0,0,0,.5);transition:transform .38s cubic-bezier(.2,.9,.25,1),width .38s cubic-bezier(.2,.9,.25,1)}

/* Tira de días */
.dias{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:thin;scroll-snap-type:x proximity}
.dia{scroll-snap-align:center;flex:0 0 auto;min-width:54px;background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;padding:8px 8px 9px;cursor:pointer;text-align:center;line-height:1.15;transition:transform .2s,background .2s,border-color .2s}
.dia:hover{transform:translateY(-3px);background:var(--vidrio2)}
.dia small{display:block;color:var(--texto2);font-size:11.5px}
.dia b{display:block;font-size:17px;font-weight:600}
.dia i{display:block;width:7px;height:7px;border-radius:50%;margin:5px auto 0;background:var(--texto3)}
.dia i.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dia i.rev{background:var(--mango);box-shadow:0 0 8px var(--mango)}
.dia i.pen{background:var(--texto2)} .dia i.err{background:var(--hibisco);box-shadow:0 0 8px var(--hibisco)}
.dia[aria-current="true"]{background:linear-gradient(160deg,var(--mar),var(--mar2));border-color:transparent;color:#04201E;box-shadow:0 10px 26px -10px var(--mar2)}
.dia[aria-current="true"] small{color:rgba(4,32,30,.72)}
.dia[aria-current="true"] i{background:#04201E;box-shadow:none}
.dia.sin{opacity:.45}

/* Paneles de vidrio con luz que sigue al cursor */
.panel{position:relative;overflow:hidden;background:var(--vidrio);border:1px solid var(--borde);border-radius:20px;padding:20px 22px;box-shadow:var(--sombra);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(43,217,196,.13),transparent 62%)}
.panel:hover::after{opacity:1}
.panel>*{position:relative;z-index:1}
.panel h2{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.005em}
.panel .sub{margin:0 0 14px;font-size:13px;color:var(--texto2)}
.panel h3{margin:16px 0 6px;font-size:13px;font-weight:500;color:var(--texto2)}
.vacio{color:var(--texto3);font-style:italic}
.rejilla{display:grid;gap:14px;margin-top:14px;align-items:start}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))} .r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.r21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.span2{grid-column:span 2}

/* Entrada orquestada: una sola vez, al abrir */
body.primera .e{animation:entra .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.985)}}

/* Portada */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;align-items:center;padding:26px 30px}
.hero.panel{background:linear-gradient(135deg,rgba(15,163,177,.13),rgba(15,163,177,.02) 55%,rgba(217,165,102,.06)),var(--vidrio)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(135deg,var(--mar),transparent 36%,transparent 64%,var(--mango));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.rot{margin:0;color:var(--texto2);font-size:14px}
.gran{margin:6px 0 12px;font-size:clamp(44px,7.4vw,88px);line-height:1;font-weight:600;letter-spacing:-.035em;text-shadow:0 0 50px rgba(43,217,196,.35)}
.estado{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.estado.sube{background:rgba(79,209,139,.15);color:var(--ok)} .estado.baja{background:rgba(217,165,102,.16);color:var(--mango)}
.hechos{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:500;background:var(--vidrio2);color:var(--texto2);border:1px solid var(--borde)}
.chip b{color:var(--texto);font-weight:600}

.anillo{position:relative;width:min(100%,250px);margin:0 auto}

.pista{fill:none;stroke:var(--vidrio2);stroke-width:14}
.arco,.arco2{fill:none;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1) .15s}

/* Alertas */
.alertas{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}

.alerta.revisar{border-color:rgba(217,165,102,.4);background:rgba(217,165,102,.09)} .alerta.revisar::before{background:var(--mango);box-shadow:0 0 14px var(--mango)}
.alerta.pendiente::before{background:var(--texto3)}

/* Cifras con mini gráfica */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px;margin-top:14px}
.tile{padding:16px 18px 12px}
.tile .et{font-size:12.5px;color:var(--texto2)}

.tile .delta{font-size:12px;font-weight:600;display:inline-flex;gap:4px}
.delta.bien{color:var(--ok)} .delta.mal{color:var(--hibisco)} .delta.neu{color:var(--texto2)}
.tile .sub2{display:block;font-size:12px;color:var(--texto3);min-height:18px}
.spark{display:block;width:100%;height:34px;margin-top:6px;color:var(--mar)}
.spark path.l{fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.spark path.a{fill:currentColor;fill-opacity:.13}

/* Gráficas */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.pill{background:var(--vidrio);border:1px solid var(--borde);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--texto2);transition:all .2s}
.pill:hover{color:var(--texto)} .pill[aria-pressed="true"]{background:var(--mar);border-color:var(--mar);color:#04201E;font-weight:600}
.graf{position:relative;width:100%}
.graf svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.rej{stroke:var(--borde);stroke-width:1;stroke-dasharray:3 5}
.eje{fill:var(--texto3);font-size:11px;font-family:var(--sans)}
.eje.sel{fill:var(--texto);font-weight:600}
.traza{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 4px 10px rgba(43,217,196,.35))}
#app.listo .traza{stroke-dashoffset:0}
.relleno{opacity:0;transition:opacity 1.2s ease .5s} #app.listo .relleno{opacity:1}
.metaln{fill:none;stroke:var(--texto2);stroke-width:1.5;stroke-dasharray:5 5;opacity:.8}
.punto{fill:var(--bg);stroke-width:2}
.mira{stroke:var(--texto2);stroke-width:1;stroke-dasharray:3 3;opacity:0;pointer-events:none}
.graf:hover .mira{opacity:.8}
.halo{fill:none;stroke-width:2;opacity:.45}
.crece{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.9,.25,1) calc(var(--d,0)*1ms)}
#app.listo .crece{transform:scaleY(1)}
.colb .barra{transition:filter .2s,opacity .2s}
.colb:hover .barra{filter:brightness(1.3)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--texto2);margin-top:8px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* Tooltip */
.tip{position:fixed;left:0;top:0;z-index:100;pointer-events:none;background:rgba(8,20,26,.94);color:#E9F2F1;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 13px;font-size:12.5px;line-height:1.45;box-shadow:0 14px 34px -10px rgba(0,0,0,.7);backdrop-filter:blur(8px);max-width:260px}

/* Cinta de caja */
.cinta{position:relative;z-index:1;background:var(--papel);color:var(--papel-tinta);border-radius:6px 6px 0 0;padding:22px 24px 20px;margin-bottom:12px;font-family:var(--mono);font-size:13.5px;
  box-shadow:0 22px 40px -18px rgba(0,0,0,.7);transform:rotate(-.5deg);transition:transform .4s cubic-bezier(.2,.9,.25,1)}
.cinta:hover{transform:rotate(0) translateY(-3px)}
.cinta::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-135deg,var(--papel) 6px,transparent 0),linear-gradient(135deg,var(--papel) 6px,transparent 0);background-size:13px 10px}

.lin{display:flex;align-items:baseline;gap:6px;padding:1px 0;opacity:0;transform:translateY(-7px);transition:opacity .3s ease calc(var(--n)*55ms + 350ms),transform .3s ease calc(var(--n)*55ms + 350ms)}

.lin .p{flex:1;border-bottom:1px dotted var(--papel-linea);transform:translateY(-3px);min-width:12px}
.lin.cero{color:#9A9F94}
.lin.tot{font-weight:500;margin-top:6px;padding-top:6px;border-top:1px solid var(--papel-linea)}
.cuadra{margin:12px 0 0;font-family:var(--sans);font-size:13px;font-weight:600}

/* Personal */
.equipo{display:grid;gap:10px}
.persona{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#04201E;background:linear-gradient(135deg,var(--mar),var(--mango))}

.rv{height:5px;border-radius:3px;background:var(--vidrio2);margin-top:5px;overflow:hidden}
.rv i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--mar2),var(--mar));transition:width 1s cubic-bezier(.2,.8,.2,1) .3s}
#app.listo .rv i{width:var(--w)}
.persona small{color:var(--texto2);font-size:12px}

/* Donut */
.dona-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.dona{position:relative;width:150px;flex:0 0 150px}
.dona svg{display:block;width:100%;height:auto;transform:rotate(-90deg)}
.seg{fill:none;stroke-width:15;stroke-dasharray:0 var(--C);transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--d)*1ms),stroke-width .2s;cursor:pointer}
#app.listo .seg{stroke-dasharray:var(--len) calc(var(--C) - var(--len))}
.seg:hover,.seg.on{stroke-width:19}
.dona-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dona-centro b{font-size:19px;font-weight:600;line-height:1.1} .dona-centro span{font-size:11.5px;color:var(--texto2)}
.dona-leyenda{flex:1;min-width:130px;display:grid;gap:8px;margin:0;padding:0;list-style:none}
.dona-leyenda li{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:13.5px}
.dona-leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}

/* Listas y tablas */
.lista{margin:0;padding:0;list-style:none;display:grid}
.lista li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--borde)}
.lista li:last-child{border-bottom:0}
dl.pares{margin:0;display:grid;grid-template-columns:minmax(110px,40%) 1fr}
dl.pares dt,dl.pares dd{margin:0;padding:9px 0;border-bottom:1px solid var(--borde)}
dl.pares dt{color:var(--texto2);font-size:13.5px;padding-right:12px}
dl.pares dt:last-of-type,dl.pares dd:last-of-type{border-bottom:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--texto2);text-align:left;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
tbody tr{transition:background .15s} tbody tr:hover{background:var(--vidrio2)}
tr:last-child td{border-bottom:0}
.der{text-align:right}
tfoot td{border-top:1px solid var(--borde);font-weight:600}
.busca{width:100%;max-width:320px;background:var(--vidrio);border:1px solid var(--borde);border-radius:10px;padding:9px 14px;margin:0 0 10px}
.busca::placeholder{color:var(--texto3)}

/* Mapa de calor */
.mapa{display:grid;gap:3px;--cols:10;overflow-x:auto;padding-bottom:4px}
.mapa .fila{display:grid;grid-template-columns:34px repeat(var(--cols),minmax(26px,1fr));gap:3px;align-items:center}
.mapa .dn{font-size:11.5px;color:var(--texto3);text-align:right;padding-right:6px;cursor:pointer}
.mapa .dn.sel{color:var(--texto);font-weight:700}
.mapa .hh{font-size:11px;color:var(--texto3);text-align:center}
.celda{height:24px;border-radius:6px;background:var(--vidrio);cursor:pointer;transition:transform .15s,box-shadow .15s}
.celda:hover{transform:scale(1.18);box-shadow:0 0 0 2px var(--mar);z-index:2}
.celda.cur{box-shadow:0 0 0 1.5px var(--texto)}

/* Estados */
.cargando,.error,.sindatos{text-align:center;padding:48px 24px}
.anillo-carga{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--vidrio2);border-top-color:var(--mar);animation:gira 1s linear infinite}
.error{border-color:rgba(255,107,129,.4)}
.btn{background:linear-gradient(135deg,var(--mar),var(--mar2));color:#04201E;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:600}
.nota{color:var(--texto2);font-size:13px;margin:6px 0 0}
.pie{margin-top:22px;font-size:12.5px;color:var(--texto2);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:center}
kbd{font-family:var(--mono);font-size:11.5px;background:var(--vidrio2);border:1px solid var(--borde);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
a{color:var(--mar)}

/* Entrada con PIN */
body.sin-sesion .barra,body.sin-sesion .wrap{display:none}
.login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;overflow-y:auto}
.login-card{width:min(100%,440px);text-align:center;padding:26px 24px 26px;margin:auto}
.login-card h2{font-size:20px;margin:6px 0 0;font-weight:600}
.lu-fila{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.lu{display:flex;align-items:center;gap:8px;background:var(--vidrio);border:1px solid var(--borde);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;font-weight:500;transition:transform .18s,background .2s}
.lu:hover{background:var(--vidrio2);transform:translateY(-2px)}
.lu .av,.usuario .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#04201E;background:linear-gradient(135deg,var(--mar),var(--mango))}
.lu[aria-pressed="true"]{background:linear-gradient(160deg,var(--mar),var(--mar2));color:#04201E;border-color:transparent;box-shadow:0 10px 24px -10px var(--mar2)}
html[data-tema="claro"] .lu[aria-pressed="true"]{color:#fff} html[data-tema="claro"] .lu[aria-pressed="true"] .av{color:#fff}
.lu[aria-pressed="true"] .av{background:rgba(4,32,30,.18);color:#04201E}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:20px 0 6px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--texto3);transition:all .18s}
.pin-dots i.on{background:var(--mar);border-color:var(--mar);box-shadow:0 0 14px var(--mar);transform:scale(1.12)}
.login-estado{min-height:22px;margin:6px 0 14px;font-size:13.5px;color:var(--texto2)}
.login-estado.mal{color:var(--hibisco)} .login-estado.bien{color:var(--ok);font-weight:600}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:276px;margin:0 auto}
.tk{height:58px;border-radius:18px;background:var(--vidrio);border:1px solid var(--borde);font-size:22px;font-weight:500;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .15s}
.tk:hover{background:var(--vidrio2)} .tk:active{transform:scale(.93);background:var(--mar);color:#04201E}
.tk.v{visibility:hidden}
.login.verificando .teclado,.login.bloqueado .teclado,.login.exito .teclado{opacity:.4;pointer-events:none}
.login.verificando .pin-dots i{animation:late .8s ease-in-out infinite} .login.verificando .pin-dots i:nth-child(2){animation-delay:.1s} .login.verificando .pin-dots i:nth-child(3){animation-delay:.2s} .login.verificando .pin-dots i:nth-child(4){animation-delay:.3s}
@keyframes late{50%{transform:scale(1.35)}}
.pin-dots.err i{background:var(--hibisco);border-color:var(--hibisco);box-shadow:0 0 14px var(--hibisco)}
.login.exito .pin-dots i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 14px var(--ok)}
.sacude{animation:sacude .45s}
@keyframes sacude{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.usuario{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;background:var(--vidrio);border:1px solid var(--borde);font-size:13px;font-weight:500}

@media (max-width:980px){
  .r3{grid-template-columns:repeat(2,minmax(0,1fr))} .r21{grid-template-columns:1fr} .span2{grid-column:auto}
}
@media (max-width:720px){
  .barra{position:static} .ib .tx{display:none} .ib{padding:9px 11px} .logo{flex:1 1 60%} .pulso small{display:none} .usuario{padding:3px} .usuario .un{display:none}
  .hero{grid-template-columns:1fr;padding:22px 20px} .anillo{width:min(70%,220px);margin-top:10px}
  .r3,.r2{grid-template-columns:1fr} .logo h1{font-size:17px} .barra-in{padding:10px 14px} .wrap{padding:14px 14px 50px}
  .panel{padding:18px 16px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .arco,.arco2{stroke-dashoffset:var(--off)} .traza{stroke-dashoffset:0} .relleno,.lin{opacity:1;transform:none} .crece{transform:none} .rv i{width:var(--w)} .seg{stroke-dasharray:var(--len) calc(var(--C) - var(--len))}
}

<script>
/* ───────── Estado ───────── */
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS_CORTO=['dom','lun','mar','mié','jue','vie','sáb'];
var REFRESCO_MS=5*60*1000;
var S={meses:null,claves:[],clave:null,cuadre:null,ath:null,tab:'cuadre',dia:null,q:'',metrica:'venta',actualizado:null,proximo:0,cargando:false,token:null,usuario:null,timer:null,sesionCaida:false};

/* ───────── Utilidades ───────── */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){n=Number(n)||0;return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function corto(v){return v>=1000?'$'+(Math.round(v/100)/10).toString().replace(/\.0$/,'')+'k':'$'+Math.round(v)}
function parts(iso){var p=iso.split('-').map(Number);return{y:p[0],m:p[1],d:p[2],w:new Date(p[0],p[1]-1,p[2]).getDay()}}
function fechaLarga(iso){var p=parts(iso);return DIAS[p.w]+' '+p.d+' de '+MESES[p.m-1]}
function horaCorta(h){return (h%12||12)+(h<12?' a. m.':' p. m.')}
function suma(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function run(fn){var args=[].slice.call(arguments,1);
  return new Promise(function(ok,fail){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){
    if(/SESION_INVALIDA/.test((e&&e.message)||String(e)))sesionVencida();
    fail(e)});r[fn].apply(r,args)})}

/* ───────── Entrada con PIN ───────── */
var L={usuarios:[],id:null,pin:'',ocupado:false};
function guardarSesion(t,u){try{sessionStorage.setItem('cm-token',t);sessionStorage.setItem('cm-usuario',JSON.stringify(u))}catch(e){}}
function leerSesion(){try{var t=sessionStorage.getItem('cm-token'),u=JSON.parse(sessionStorage.getItem('cm-usuario')||'null');return t&&u?{token:t,usuario:u}:null}catch(e){return null}}
function borrarSesion(){try{sessionStorage.removeItem('cm-token');sessionStorage.removeItem('cm-usuario')}catch(e){}}
function estadoLogin(txt,tipo){var e=$('#loginEstado');e.textContent=txt;e.className='login-estado'+(tipo?' '+tipo:'')}
function sacudir(id){var e=$(id);e.classList.remove('sacude');void e.offsetWidth;e.classList.add('sacude')}

async function arrancar(){
  var ses=leerSesion();
  if(ses){S.token=ses.token;S.usuario=ses.usuario;entrarAlTablero();return}
  mostrarLogin();
}

async function mostrarLogin(msg){
  S.token=null;S.usuario=null;S.meses=null;S.cuadre=null;S.ath=null;S.dia=null;S.proximo=0;
  $('#app').innerHTML='';tipOff();
  document.body.classList.add('sin-sesion');
  var el=$('#login');el.hidden=false;el.classList.remove('verificando','bloqueado','exito');
  L.pin='';L.ocupado=false;pintarPin();
  if(!L.usuarios.length){
    try{L.usuarios=await run('getUsuarios')}catch(e){estadoLogin('No pude conectar con el servidor. Recarga la página.','mal');return}
  }
  var ultimo=null;try{ultimo=localStorage.getItem('cm-ultimo')}catch(e){}
  L.id=L.usuarios.some(function(u){return u.id===ultimo})?ultimo:null;
  pintarUsuarios();
  estadoLogin(msg||(L.id?'Escribe tu PIN.':'Elige tu nombre y escribe tu PIN.'));
}

function pintarUsuarios(){
  $('#luFila').innerHTML=L.usuarios.map(function(u){
    return '<button class="lu" type="button" data-u="'+esc(u.id)+'" aria-pressed="'+(u.id===L.id)+'"><span class="av" aria-hidden="true">'+esc(u.nombre.charAt(0))+'</span>'+esc(u.nombre)+'</button>';
  }).join('');
}
function pintarPin(){document.querySelectorAll('#pinDots i').forEach(function(d,i){d.classList.toggle('on',i<L.pin.length)})}

function teclear(k){
  if(L.ocupado)return;
  if(k==='b'){L.pin=L.pin.slice(0,-1);pintarPin();return}
  if(!L.id){sacudir('#luFila');estadoLogin('Primero elige tu nombre.','mal');return}
  if(L.pin.length>=4)return;
  L.pin+=k;pintarPin();
  if(L.pin.length===4)verificar();
}

async function verificar(){
  var el=$('#login');L.ocupado=true;el.classList.add('verificando');estadoLogin('Verificando…');
  var r;
  try{r=await run('iniciarSesion',L.id,L.pin)}catch(e){r={ok:false,msg:'No pude conectar con el servidor. Intenta de nuevo.'}}
  el.classList.remove('verificando');
  if(r&&r.ok){
    S.token=r.token;S.usuario=r.usuario;guardarSesion(r.token,r.usuario);
    try{localStorage.setItem('cm-ultimo',r.usuario.id)}catch(e){}
    el.classList.add('exito');estadoLogin('Hola, '+r.usuario.nombre+'.','bien');
    setTimeout(function(){el.classList.remove('exito');entrarAlTablero()},750);
    return;
  }
  var m=(r&&r.msg)||'PIN incorrecto.';
  if(r&&r.restantes!=null)m+=' Te quedan '+r.restantes+' '+(r.restantes===1?'intento':'intentos')+'.';
  estadoLogin(m,'mal');
  el.classList.toggle('bloqueado',!!(r&&r.bloqueado));
  $('#pinDots').classList.add('err');sacudir('#pinDots');
  setTimeout(function(){L.pin='';pintarPin();$('#pinDots').classList.remove('err');L.ocupado=false},420);
}

function entrarAlTablero(){
  S.sesionCaida=false;
  $('#login').hidden=true;document.body.classList.remove('sin-sesion');
  $('#usAv').textContent=S.usuario.nombre.charAt(0);$('#usNom').textContent=S.usuario.nombre;$('#usuario').hidden=false;
  iniciar();
}

function sesionVencida(){
  if(S.sesionCaida||!S.token)return;
  S.sesionCaida=true;borrarSesion();
  mostrarLogin('Tu sesión terminó. Escribe tu PIN para entrar de nuevo.');
}

function salir(){
  var t=S.token;borrarSesion();S.sesionCaida=true;
  if(t){try{google.script.run.cerrarSesion(t)}catch(e){}}
  $('#usuario').hidden=true;
  mostrarLogin('Sesión cerrada.');
}
function buenos(obj){return obj&&obj.dias?obj.dias.filter(function(d){return !d.error}):[]}
function diaDe(obj,iso){return obj&&obj.dias?obj.dias.filter(function(d){return d.fecha===iso})[0]:null}
function reducir(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches}
function paso(max){var e=Math.pow(10,Math.floor(Math.log10(max))),f=max/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

/* ───────── Carga de datos ───────── */
async function iniciar(){
  try{
    S.meses=await run('getMeses',S.token);
    var todos=S.meses.cuadres.concat(S.meses.ath), vistos={}, claves=[];
    todos.forEach(function(m){if(!vistos[m.clave]){vistos[m.clave]=1;claves.push({clave:m.clave,etiqueta:m.etiqueta})}});
    claves.sort(function(a,b){return a.clave<b.clave?1:-1});
    S.claves=claves;
    if(!claves.length){return mostrarError('No encontré carpetas de meses en Drive. Revisa los IDs de carpeta en Code.gs.')}
    $('#mes').innerHTML=claves.map(function(c){return '<option value="'+c.clave+'">'+esc(c.etiqueta)+'</option>'}).join('');
    S.clave=claves[0].clave;
    await cargarMes(false);
    if(!S.timer)S.timer=setInterval(function(){if(S.token)cargarMes(true)},REFRESCO_MS);
  }catch(e){if(!S.sesionCaida)mostrarError(e)}
}

async function cargarMes(silencioso){
  if(S.cargando)return; S.cargando=true;
  var c=S.meses.cuadres.filter(function(m){return m.clave===S.clave})[0];
  var a=S.meses.ath.filter(function(m){return m.clave===S.clave})[0];
  if(!silencioso){
    $('#app').classList.remove('listo');
    $('#app').innerHTML='<div class="panel cargando"><div class="logo-completo" role="img" aria-label="Historias y un Café, desayuno y brunch"></div><strong>Leyendo las hojas del mes…</strong><p class="nota">La primera vez en un mes puede tardar hasta 30 segundos. Después abre al instante.</p></div>';
  }
  var ib=$('#btnActualizar svg'); if(ib){ib.parentNode.classList.add('giro')}
  try{
    var r=await Promise.all([c?run('getDatosMes',S.token,'cuadre',c.id):null,a?run('getDatosMes',S.token,'ath',a.id):null]);
    S.cuadre=r[0];S.ath=r[1];S.actualizado=new Date();S.proximo=Date.now()+REFRESCO_MS;
    var f=fechasMes();
    if(!S.dia||f.indexOf(S.dia)<0)S.dia=f[f.length-1]||null;
    if(!silencioso)ajustarDia();
    render();
  }catch(e){ if(!silencioso&&!S.sesionCaida)mostrarError(e) }
  finally{S.cargando=false;setTimeout(function(){var b=$('#btnActualizar');if(b)b.classList.remove('giro')},800)}
}

function fechasMes(){
  var set={};
  [S.cuadre,S.ath].forEach(function(o){if(o&&o.dias)o.dias.forEach(function(d){set[d.fecha]=1})});
  return Object.keys(set).sort();
}

/* Si el día elegido no tiene archivo en la pestaña activa, salta al último día que sí lo tiene. */
function ajustarDia(){
  var obj=S.tab==='cuadre'?S.cuadre:S.ath;
  if(!obj||!obj.dias||!obj.dias.length)return;
  if(!diaDe(obj,S.dia))S.dia=obj.dias[obj.dias.length-1].fecha;
}

function mostrarError(e){
  var msg=(e&&e.message)?e.message:String(e);
  $('#app').innerHTML='<div class="panel error"><strong>No pude leer los datos de Drive.</strong><p>'+esc(msg)+'</p>'+
   '<p class="nota">Verifica que la cuenta que publicó esta página tenga acceso a las carpetas de cuadres y de ATH Móvil.</p>'+
   '<button class="btn" type="button" data-act="reintentar">Intentar de nuevo</button></div>';
}

/* ───────── Render general ───────── */
function render(){
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.tab===S.tab))});
  var app=$('#app'); app.classList.remove('listo');
  app.innerHTML=tiraDias()+(S.tab==='cuadre'?vistaCuadre():vistaAth())+pie();
  posicionarIndicador();
  dibujarGraficas();
  numeros();
  var activo=$('.dia[aria-current="true"]'); if(activo&&activo.scrollIntoView){activo.scrollIntoView({block:'nearest',inline:'center'})}
  requestAnimationFrame(function(){requestAnimationFrame(function(){app.classList.add('listo');
    setTimeout(function(){document.body.classList.remove('primera')},1600)})});
}

function posicionarIndicador(){
  var t=$('.tab[aria-selected="true"]'), i=$('#ind'); if(!t||!i)return;
  i.style.width=t.offsetWidth+'px'; i.style.transform='translateX('+(t.offsetLeft-4)+'px)';
}

function numeros(){
  document.querySelectorAll('[data-cuenta]').forEach(function(el){
    var fin=parseFloat(el.dataset.cuenta), fmt=el.dataset.fmt||'money';
    function pintar(v){el.textContent=fmt==='int'?Math.round(v).toLocaleString('en-US'):fmt==='pct'?Math.round(v)+'%':money(v)}
    if(reducir()||!isFinite(fin)){pintar(isFinite(fin)?fin:0);return}
    var t0=null; pintar(0);
    function frame(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1000),e=1-Math.pow(1-p,4);pintar(fin*e);if(p<1)requestAnimationFrame(frame)}
    requestAnimationFrame(frame);
  });
}

function tiraDias(){
  var fechas=fechasMes();
  if(!fechas.length)return '';
  return '<div class="dias e" style="--i:0" role="listbox" aria-label="Días del mes">'+fechas.map(function(f){
    var p=parts(f), obj=S.tab==='cuadre'?S.cuadre:S.ath, d=diaDe(obj,f), est='', tit='';
    if(!d){tit='Sin archivo'}
    else if(d.error){est='err';tit='Error al leer'}
    else if(d.alertas&&d.alertas.some(function(a){return a.nivel==='revisar'})){est='rev';tit='Hay algo que revisar'}
    else if(S.tab==='cuadre'&&!d.hecho){est='pen';tit='Pendiente de cerrar'}
    else {est='ok';tit='Sin alertas'}
    return '<button class="dia'+(d?'':' sin')+'" type="button" data-act="dia" data-f="'+f+'" title="'+tit+'" '+(f===S.dia?'aria-current="true"':'')+'>'+
      '<small>'+DIAS_CORTO[p.w]+'</small><b>'+p.d+'</b><i class="'+est+'"></i></button>';
  }).join('')+'</div>';
}

function pie(){
  var h=S.actualizado?S.actualizado.toLocaleTimeString('es-PR',{hour:'numeric',minute:'2-digit'}):'';
  var arch=S.tab==='cuadre'?diaDe(S.cuadre,S.dia):diaDe(S.ath,S.dia);
  var enlace=arch&&arch.archivo?'<a href="'+esc(arch.archivo.url)+'" target="_blank" rel="noopener">Abrir la hoja original</a>':'';
  return '<div class="pie"><span>Última lectura de Drive: '+esc(h)+' &nbsp;'+enlace+'</span><span class="teclas"><kbd>←</kbd> <kbd>→</kbd> cambiar de día &nbsp; <kbd>1</kbd> <kbd>2</kbd> secciones &nbsp; <kbd>T</kbd> tema</span></div><div class="firma"><div class="logo-completo" style="--lw:104px" role="img" aria-label="Historias y un Café, desayuno y brunch"></div></div>';
}

function alertasHtml(d){
  if(!d.alertas||!d.alertas.length)return '';
  return '<ul class="alertas e" style="--i:2">'+d.alertas.map(function(a){
    return '<li class="alerta '+a.nivel+'"><b>'+(a.nivel==='revisar'?'Revisar':'Pendiente')+'</b><span>'+esc(a.texto)+'</span></li>';
  }).join('')+'</ul>';
}

function sinHoja(tipo){
  var txt=tipo==='cuadre'?'hoja de cuadre':'reporte de ATH Móvil';
  return '<div class="panel sindatos e"><strong>No hay '+txt+' para el '+esc(S.dia?fechaLarga(S.dia):'día elegido')+'.</strong>'+
    '<p class="nota">Si el día ya pasó, revisa que el archivo esté en la carpeta del mes y que su nombre lleve la fecha.</p></div>';
}

/* ───────── Cuadre del día ───────── */
function vistaCuadre(){
  if(!S.cuadre)return '<div class="panel sindatos">No hay carpeta de cuadres para este mes.</div>';
  var d=diaDe(S.cuadre,S.dia);
  if(!d)return sinHoja('cuadre')+graficaMesPanel();
  if(d.error)return '<div class="panel error"><strong>No pude leer esta hoja.</strong><p>'+esc(d.error)+'</p></div>';

  var pct=d.meta>0?d.ventaNeta/d.meta:0, dif=d.ventaNeta-d.meta, bajo=dif<0;
  var C1=2*Math.PI*88, C2=2*Math.PI*104, off1=C1*(1-clamp(pct,0,1)), exceso=clamp(pct-1,0,1), off2=C2*(1-exceso);
  var anillo='<div class="anillo" role="img" aria-label="'+Math.round(pct*100)+' por ciento de la meta"><svg viewBox="0 0 250 250" aria-hidden="true"><defs><linearGradient id="gAn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mar)"/><stop offset="1" style="stop-color:var(--mar2)"/></linearGradient></defs>'+
    '<circle class="pista" cx="125" cy="125" r="88"/>'+
    '<circle class="arco" cx="125" cy="125" r="88" stroke="url(#gAn)" transform="rotate(-90 125 125)" style="--c:'+C1.toFixed(1)+';--off:'+off1.toFixed(1)+'"/>'+
    (exceso>0?'<circle class="arco2" cx="125" cy="125" r="104" transform="rotate(-90 125 125)" style="--c:'+C2.toFixed(1)+';--off:'+off2.toFixed(1)+'"/>':'')+
    '</svg><div class="anillo-centro"><b data-cuenta="'+(pct*100).toFixed(1)+'" data-fmt="pct">'+Math.round(pct*100)+'%</b><span>'+(d.meta>0?'de la meta':'sin meta')+'</span></div></div>';

  var hero='<section class="panel hero e" style="--i:1" aria-label="Resumen del día"><div>'+
    '<p class="rot">Venta neta del '+esc(fechaLarga(d.fecha))+'</p>'+
    '<p class="gran" data-cuenta="'+d.ventaNeta+'">'+money(d.ventaNeta)+'</p>'+
    '<span class="estado '+(bajo?'baja':'sube')+'">'+(bajo?'▼ Faltaron '+money(-dif)+' para la meta de '+money(d.meta):'▲ Superó la meta de '+money(d.meta)+' por '+money(dif))+'</span>'+
    '<div class="hechos">'+
      '<span class="chip">Cajer@ AM <b>'+esc(d.cajeroAM||'—')+'</b></span><span class="chip">Cajer@ PM <b>'+esc(d.cajeroPM||'—')+'</b></span>'+
      '<span class="chip '+(d.hecho?'ok':'')+'">'+(d.hecho?'Hoja hecha':'Hoja sin cerrar')+'</span>'+
      '<span class="chip '+(d.operacion.validadoPor?'ok':'')+'">'+(d.operacion.validadoPor?'Validó <b>'+esc(d.operacion.validadoPor)+'</b>':'Sin validar')+'</span>'+
      '<span class="chip">Closeout <b>'+esc(d.closeout||'sin anotar')+'</b></span>'+
    '</div></div>'+anillo+'</section>';

  var serie=function(f){return buenos(S.cuadre).filter(function(x){return x.fecha<=d.fecha}).slice(-14).map(f)};
  var prom=function(f){var v=buenos(S.cuadre).filter(function(x){return x.ventaNeta>0&&x.fecha!==d.fecha}).map(f);return v.length?suma(v)/v.length:0};
  var tiles='<div class="tiles">'+
    tile(0,'Cash en caja',d.cash,serie(function(x){return x.cash}),prom(function(x){return x.cash}),'neu','var(--mar)','')+
    tile(1,'DoorDash',d.doordash,serie(function(x){return x.doordash}),prom(function(x){return x.doordash}),'sube','var(--hibisco)','')+
    tile(2,'Propinas',d.propinas.total,serie(function(x){return x.propinas.total}),prom(function(x){return x.propinas.total}),'sube','var(--mango)',d.propinas.porcentaje?d.propinas.porcentaje+' de la venta':'')+
    tile(3,'Descuentos',d.descuentos.total,serie(function(x){return x.descuentos.total}),prom(function(x){return x.descuentos.total}),'baja','var(--mar2)',d.descuentos.items.length+' anotados')+
    tile(4,'Reembolsos',d.reembolsos.total,serie(function(x){return x.reembolsos.total}),prom(function(x){return x.reembolsos.total}),'baja','var(--hibisco)',d.reembolsos.items.length+' anotados')+
    tile(5,'Labor cost (L. C.)',d.operacion.lc,serie(function(x){return x.operacion.lc}),prom(function(x){return x.operacion.lc}),'baja','var(--mango)',d.operacion.lcPct?d.operacion.lcPct+' de la venta':'Sin anotar')+
  '</div>';

  var e=d.efectivo, ok=Math.abs(e.diferencia)<0.005, n=0;
  var cinta='<section class="cinta e" style="--i:6" aria-label="Conteo de efectivo"><h2>Conteo de efectivo</h2><p class="sub">Billetes y monedas contadas al cierre</p>'+
    e.billetes.map(function(b){return '<div class="lin'+(b.cantidad?'':' cero')+'" style="--n:'+(n++)+'"><span>'+esc(b.den)+' × '+b.cantidad+'</span><span class="p"></span><span>'+money(b.total)+'</span></div>'}).join('')+
    lin('Subtotal',money(e.subtotal),n++,true)+lin('Petty',money(e.petty),n++)+lin('Total',money(e.total),n++,true)+lin('Diferencia',money(e.diferencia),n++)+
    '<p class="cuadra" style="color:'+(ok?'#1E7A4A':'#B3372C')+'">'+(ok?'✓ El conteo cuadra.':'✕ El conteo no cuadra: revisa la diferencia.')+'</p></section>';

  var p=d.propinas, ath=diaDe(S.ath,d.fecha), cot='';
  if(ath&&!ath.error){var igual=ath.cantidad===p.transaccionesATH;
    cot='<p class="nota"><span class="chip '+(igual?'ok':'rev')+'">'+(igual?'Coincide con el reporte':'No coincide con el reporte')+'</span><br>El reporte de ATH Móvil de este día tiene '+ath.cantidad+' transacciones por '+money(ath.total)+'.</p>';
  }else if(S.ath){cot='<p class="nota">No hay reporte de ATH Móvil de este día para cotejar.</p>'}
  var propinas='<section class="panel e" style="--i:7"><h2>Propinas</h2><p class="sub">Cómo se repartieron según el cuadre</p>'+dona([
      {n:'ATH Móvil',v:p.ath,c:'var(--mar)'},{n:'Efectivo',v:p.efectivo,c:'var(--mango)'},{n:'Tarjeta',v:p.tarjeta,c:'var(--hibisco)'}],p.total)+
    '<h3>Transacciones de ATH Móvil en el cuadre</h3><p style="margin:0;font-size:24px;font-weight:600" data-cuenta="'+p.transaccionesATH+'" data-fmt="int">'+p.transaccionesATH+'</p>'+cot+
    '<h3>Notas del cuadre</h3>'+(d.notas?'<p style="margin:0;white-space:pre-wrap">'+esc(d.notas)+'</p>':'<p class="vacio" style="margin:0">Sin notas.</p>')+'</section>';

  var personal='<section class="panel e" style="--i:8"><h2>Personal en turno</h2><p class="sub">Con sus reviews del día</p>'+
    (d.personal.length?'<div class="equipo">'+d.personal.map(function(x){
      var m=String(x.reviews||'').match(/^(\d+)\s*\/\s*(\d+)$/), w=m&&+m[2]?clamp(+m[1]/+m[2]*100,0,100):0;
      return '<div class="persona"><div class="avatar" aria-hidden="true">'+esc(x.nombre.charAt(0))+'</div><div><div class="n">'+esc(x.nombre)+'</div>'+
        (x.reviews?'<div class="rv" title="Reviews '+esc(x.reviews)+'"><i style="--w:'+w+'%"></i></div>':'')+'</div><div class="der">'+
        (x.reviews?'<small>Reviews</small> <b>'+esc(x.reviews)+'</b>':'')+(x.emp?' <span class="chip mar">EMP</span>':'')+'</div></div>';
    }).join('')+'</div>':'<p class="vacio">Sin personal anotado.</p>')+'</section>';

  var desc='<section class="panel e" style="--i:9"><h2>Descuentos y reembolsos</h2><p class="sub">Lo anotado en el turno</p><h3 style="margin-top:0">Descuentos</h3>'+
    (d.descuentos.items.length?'<ul class="lista">'+d.descuentos.items.map(function(x){return li('Descuento',money(x))}).join('')+'<li><b>Total</b><b>'+money(d.descuentos.total)+'</b></li></ul>':'<p class="vacio" style="margin:0">Sin descuentos.</p>')+
    '<h3>Reembolsos</h3>'+
    (d.reembolsos.items.length?'<ul class="lista">'+d.reembolsos.items.map(function(x){return li('Reembolso',money(x))}).join('')+'<li><b>Total</b><b>'+money(d.reembolsos.total)+'</b></li></ul>':'<p class="vacio" style="margin:0">Sin reembolsos.</p>')+'</section>';

  var valid='<section class="panel e" style="--i:10"><h2>Validación y costos</h2><p class="sub">Cierre del bloque de validación</p><dl class="pares">'+
    par('Validado por',esc(d.operacion.validadoPor||'Sin validar'))+
    par('V. B. (venta bruta)',d.operacion.vb?money(d.operacion.vb):'<span class="vacio">Sin anotar</span>')+
    par('V. N. (venta neta)',d.operacion.vn?money(d.operacion.vn):'<span class="vacio">Sin anotar</span>')+
    par('L. C. (labor cost)',d.operacion.lc?money(d.operacion.lc):'<span class="vacio">Sin anotar</span>')+
    par('L. C. %',d.operacion.lcPct?esc(d.operacion.lcPct):'<span class="vacio">Sin anotar</span>')+
    par('Petty nuevo','<span class="chip '+(d.petty.revisado?'ok':'')+'">'+(d.petty.revisado?'Revisado':'Sin revisar')+'</span>')+
    par('Revisión del petty nuevo',d.petty.revision?esc(d.petty.revision):'<span class="vacio">Sin anotar</span>')+
  '</dl></section>';

  var serv='<section class="panel e" style="--i:11"><h2>Informe de servicio diario</h2><p class="sub">Lo que anotó el equipo</p><dl class="pares">'+
    d.servicio.map(function(s){return par(esc(s.campo),s.valor?esc(s.valor):'<span class="vacio">Sin anotar</span>')}).join('')+'</dl></section>';

  var ord='<section class="panel e span2" style="--i:12"><h2>Órdenes recibidas</h2><p class="sub">Suplidores que entregaron este día</p>'+
    (d.ordenes.length?'<div class="tbl"><table><thead><tr><th>Suplidor</th><th>Factura</th><th class="der">Cantidad</th><th>Producto recibido</th><th>Verificado por</th></tr></thead><tbody>'+
      d.ordenes.map(function(o){return '<tr><td>'+esc(o.suplidor)+'</td><td>'+(o.factura?esc(o.factura):'<span class="vacio">—</span>')+'</td><td class="der">'+(o.montoTxt?money(o.monto):'—')+'</td><td>'+esc(o.producto)+'</td><td>'+esc(o.verificadoPor)+'</td></tr>'}).join('')+
      '</tbody><tfoot><tr><td colspan="2">Total recibido</td><td class="der">'+money(suma(d.ordenes,function(o){return o.monto}))+'</td><td colspan="2"></td></tr></tfoot></table></div>':
      '<p class="vacio" style="margin:0">No se anotaron órdenes recibidas este día.</p>')+'</section>';

  return hero+alertasHtml(d)+tiles+graficaMesPanel()+
    '<div class="rejilla r3">'+cinta+propinas+personal+'</div>'+
    '<div class="rejilla r3">'+desc+valid+serv+'</div>'+
    '<div class="rejilla r2">'+ord+'</div>';
}

function lin(et,val,n,fuerte){return '<div class="lin'+(fuerte?' tot':'')+'" style="--n:'+n+'"><span>'+et+'</span><span class="p"></span><span>'+val+'</span></div>'}
function li(a,b){return '<li><span>'+a+'</span><span>'+b+'</span></li>'}
function par(a,b){return '<dt>'+a+'</dt><dd>'+b+'</dd>'}

function tile(i,et,val,serie,prom,bueno,color,sub){
  var delta='';
  if(prom>0.004&&isFinite(val)){
    var p=(val-prom)/prom*100, sube=p>=0, neutro=Math.abs(p)<1||bueno==='neu';
    var cls=neutro?'neu':((sube&&bueno==='sube')||(!sube&&bueno==='baja')?'bien':'mal');
    delta='<span class="delta '+cls+'">'+(sube?'▲':'▼')+' '+Math.abs(Math.round(p))+'% <span style="font-weight:400;color:var(--texto3)">vs. promedio</span></span>';
  }
  return '<div class="panel tile e" style="--i:'+(3+i*0.5)+'"><span class="et">'+et+'</span><span class="val" data-cuenta="'+(val||0)+'">'+money(val||0)+'</span>'+
    (delta||'<span class="delta neu">&nbsp;</span>')+'<span class="sub2">'+esc(sub||'')+'</span>'+spark(serie,color)+'</div>';
}

function suave(p){
  if(p.length<2)return 'M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
  var d='M'+p[0][0].toFixed(1)+' '+p[0][1].toFixed(1);
  for(var i=0;i<p.length-1;i++){
    var p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    var lo=Math.min(p1[1],p2[1]),hi=Math.max(p1[1],p2[1]);
    var c1y=clamp(p1[1]+(p2[1]-p0[1])/6,lo,hi),c2y=clamp(p2[1]-(p3[1]-p1[1])/6,lo,hi);
    d+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+c1y.toFixed(1)+','+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+c2y.toFixed(1)+','+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}

function spark(vals,color){
  if(!vals||vals.length<2||!vals.some(function(v){return v>0}))return '<svg class="spark" viewBox="0 0 100 34" aria-hidden="true"></svg>';
  var max=Math.max.apply(null,vals)||1, n=vals.length;
  var pts=vals.map(function(v,i){return [i*100/(n-1),30-(v/max)*26]});
  var l=suave(pts);
  return '<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" style="color:'+color+'" aria-hidden="true"><path class="a" d="'+l+' L100 34 L0 34Z"/><path class="l" d="'+l+'"/></svg>';
}

function dona(items,total){
  var r=54, C=2*Math.PI*r, acum=0;
  var suma_=suma(items,function(x){return x.v});
  if(suma_<=0)return '<p class="vacio" style="margin:0">Sin propinas este día.</p>';
  var segs=items.map(function(x,i){
    var len=x.v/suma_*C, o=-acum; acum+=len;
    return len>0?'<circle class="seg" data-i="'+i+'" cx="70" cy="70" r="'+r+'" stroke="'+x.c+'" style="--C:'+C.toFixed(1)+';--len:'+Math.max(len-2,0.1).toFixed(1)+';--d:'+(i*180)+'" stroke-dashoffset="'+o.toFixed(1)+'"/>':'';
  }).join('');
  return '<div class="dona-wrap" data-total="'+total+'"><div class="dona"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--vidrio2)" stroke-width="15"/>'+segs+'</svg>'+
    '<div class="dona-centro"><b id="dnV" data-cuenta="'+total+'">'+money(total)+'</b><span id="dnN">Total</span></div></div>'+
    '<ul class="dona-leyenda">'+items.map(function(x,i){return '<li data-i="'+i+'"><span><i style="background:'+x.c+'"></i>'+x.n+'</span><b>'+money(x.v)+'</b></li>'}).join('')+'</ul></div>';
}

/* ───────── Gráfica del mes (cuadre) ───────── */
var METRICAS={venta:{n:'Venta neta',f:function(d){return d.ventaNeta},c:'var(--mar)',ref:true},
  propinas:{n:'Propinas',f:function(d){return d.propinas.total},c:'var(--mango)'},
  doordash:{n:'DoorDash',f:function(d){return d.doordash},c:'var(--hibisco)'},
  cash:{n:'Cash',f:function(d){return d.cash},c:'var(--mar2)'}};

function graficaMesPanel(){
  var dias=buenos(S.cuadre); if(!dias.length)return '';
  var conV=dias.filter(function(d){return d.ventaNeta>0});
  var tot=suma(conV,function(d){return d.ventaNeta}), conMeta=conV.filter(function(d){return d.meta>0&&d.ventaNeta>=d.meta}).length;
  var mejor=conV.slice().sort(function(a,b){return b.ventaNeta-a.ventaNeta})[0];
  return '<section class="panel e" style="--i:5;margin-top:14px"><h2>El mes día por día</h2><p class="sub">Toca un punto para abrir ese día. Pasa el cursor para ver el detalle.</p>'+
    '<div class="tiles" style="margin:0 0 14px"><div><span class="et" style="font-size:12.5px;color:var(--texto2)">Venta neta del mes</span><strong style="display:block;font-size:22px;font-weight:600" data-cuenta="'+tot+'">'+money(tot)+'</strong></div>'+
    '<div><span class="et" style="font-size:12.5px;color:var(--texto2)">Promedio por día con venta</span><strong style="display:block;font-size:22px;font-weight:600" data-cuenta="'+(conV.length?tot/conV.length:0)+'">'+money(conV.length?tot/conV.length:0)+'</strong></div>'+
    '<div><span class="et" style="font-size:12.5px;color:var(--texto2)">Días que cumplieron la meta</span><strong style="display:block;font-size:22px;font-weight:600">'+conMeta+' de '+conV.length+'</strong></div>'+
    '<div><span class="et" style="font-size:12.5px;color:var(--texto2)">Mejor día</span><strong style="display:block;font-size:22px;font-weight:600">'+(mejor?money(mejor.ventaNeta):'—')+'</strong>'+(mejor?'<small style="color:var(--texto3)">'+esc(fechaLarga(mejor.fecha))+'</small>':'')+'</div></div>'+
    '<div class="pills" role="group" aria-label="Qué medir">'+Object.keys(METRICAS).map(function(k){return '<button class="pill" type="button" data-act="metrica" data-k="'+k+'" aria-pressed="'+(S.metrica===k)+'">'+METRICAS[k].n+'</button>'}).join('')+'</div>'+
    '<div class="graf" data-g="mes-cuadre"></div></section>';
}

function graficaMesCuadre(el){
  var M=METRICAS[S.metrica]||METRICAS.venta;
  var items=buenos(S.cuadre).map(function(d){
    var v=M.f(d), t='<b>'+esc(fechaLarga(d.fecha))+'</b><span>'+M.n+': <em>'+money(v)+'</em></span>';
    if(M.ref&&d.meta>0)t+='<span>Meta '+money(d.meta)+' ('+(v>=d.meta?'+':'')+money(v-d.meta)+')</span>';
    return {k:d.fecha,v:v,ref:M.ref?d.meta:null,tip:t};
  });
  graficaLinea(el,items,{color:M.c,etiqueta:M.n,alto:270});
}

function graficaLinea(el,items,o){
  var W=Math.max(el.clientWidth,280),H=o.alto||250,m={l:46,r:16,t:14,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b,n=items.length;
  if(!n){el.innerHTML='<p class="vacio">Sin datos este mes.</p>';return}
  var mx=Math.max.apply(null,items.map(function(i){return Math.max(i.v,i.ref||0)}).concat([1]));
  var st=paso(mx/4), top=Math.ceil(mx/st)*st||st;
  var X=function(i){return m.l+(n===1?iw/2:i*iw/(n-1))}, Y=function(v){return m.t+ih-(v/top)*ih};
  var g='',t;
  for(t=0;t<=top+0.001;t+=st){g+='<line class="rej" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text class="eje" x="'+(m.l-8)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end">'+corto(t)+'</text>'}
  var salto=Math.ceil(n/Math.max(4,Math.floor(iw/34))), selI=-1;
  items.forEach(function(it,i){ if(it.k===S.dia)selI=i;
    if(i%salto===0||it.k===S.dia)g+='<text class="eje'+(it.k===S.dia?' sel':'')+'" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+parts(it.k).d+'</text>'});
  var pts=items.map(function(it,i){return [X(i),Y(it.v)]}), linea=suave(pts);
  var id='a'+Math.random().toString(36).slice(2,7);
  var defs='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+o.color+';stop-opacity:.38"/><stop offset="1" style="stop-color:'+o.color+';stop-opacity:0"/></linearGradient></defs>';
  var ref='';
  if(items.some(function(i){return i.ref>0})){
    ref='<path class="metaln" d="'+items.map(function(it,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(it.ref||0).toFixed(1)}).join(' ')+'"/>';
  }
  var puntos=pts.map(function(p,i){return '<circle class="punto" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(n>20?2.5:3.5)+'" style="stroke:'+o.color+'"/>'}).join('');
  var sel=selI>=0?'<line x1="'+pts[selI][0].toFixed(1)+'" x2="'+pts[selI][0].toFixed(1)+'" y1="'+m.t+'" y2="'+(m.t+ih)+'" style="stroke:'+o.color+'" stroke-width="1.5" opacity=".55"/>'+
    '<circle class="halo" cx="'+pts[selI][0].toFixed(1)+'" cy="'+pts[selI][1].toFixed(1)+'" r="11" style="stroke:'+o.color+'"/><circle cx="'+pts[selI][0].toFixed(1)+'" cy="'+pts[selI][1].toFixed(1)+'" r="6" style="fill:'+o.color+'"/>':'';
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.etiqueta)+' por día del mes">'+defs+g+ref+
    '<path class="relleno" d="'+linea+' L'+X(n-1).toFixed(1)+' '+(m.t+ih)+' L'+X(0).toFixed(1)+' '+(m.t+ih)+'Z" fill="url(#'+id+')"/>'+
    '<path class="traza" pathLength="1" d="'+linea+'" style="stroke:'+o.color+'"/>'+puntos+sel+
    '<line class="mira" y1="'+m.t+'" y2="'+(m.t+ih)+'" x1="0" x2="0"/><circle class="halo" id="miraP" r="7" cx="-20" cy="-20" style="stroke:'+o.color+';opacity:0"/>'+
    '<rect x="'+m.l+'" y="'+m.t+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:pointer"/></svg>';
  var svg=el.firstChild, mira=svg.querySelector('.mira'), mp=svg.querySelector('#miraP'), hit=svg.lastChild;
  function idx(ev){var r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)*(W/r.width);return clamp(Math.round((x-m.l)/iw*(n-1)),0,n-1)}
  hit.addEventListener('pointermove',function(ev){var i=idx(ev);mira.setAttribute('x1',pts[i][0]);mira.setAttribute('x2',pts[i][0]);
    mp.setAttribute('cx',pts[i][0]);mp.setAttribute('cy',pts[i][1]);mp.style.opacity=1;tip(items[i].tip,ev)});
  hit.addEventListener('pointerleave',function(){tipOff();mp.style.opacity=0});
  hit.addEventListener('click',function(ev){seleccionar(items[idx(ev)].k)});
}

/* Barras: usadas para cobros por hora y por día */
function graficaBarras(el,items,o){
  var W=Math.max(el.clientWidth,260),H=o.alto||220,m={l:44,r:8,t:12,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b,n=items.length;
  if(!n){el.innerHTML='<p class="vacio">Sin transacciones.</p>';return}
  var mx=Math.max.apply(null,items.map(function(i){return i.v}).concat([1])), st=paso(mx/4), top=Math.ceil(mx/st)*st||st;
  var Y=function(v){return m.t+ih-(v/top)*ih}, bw=iw/n, g='',t;
  for(t=0;t<=top+0.001;t+=st){g+='<line class="rej" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text class="eje" x="'+(m.l-8)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end">'+corto(t)+'</text>'}
  var id='b'+Math.random().toString(36).slice(2,7), col=o.color||'var(--mar)';
  var defs='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:'+col+'"/><stop offset="1" style="stop-color:'+col+';stop-opacity:.35"/></linearGradient></defs>';
  var salto=Math.ceil(n/Math.max(4,Math.floor(iw/30)));
  var barras=items.map(function(it,i){
    var x=m.l+i*bw, h=Math.max(it.v/top*ih,it.v>0?3:0), w=Math.max(bw*0.64,3);
    return '<g class="colb" data-i="'+i+'" style="cursor:'+(o.clic?'pointer':'default')+'"><rect x="'+x.toFixed(1)+'" y="'+m.t+'" width="'+bw.toFixed(1)+'" height="'+ih+'" fill="transparent"/>'+
      '<rect class="barra crece" style="--d:'+(i*22)+';'+(it.sel?'filter:drop-shadow(0 0 8px '+col+')':'')+'" x="'+(x+(bw-w)/2).toFixed(1)+'" y="'+(m.t+ih-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="'+Math.min(5,w/2)+'" fill="'+(it.v>0?'url(#'+id+')':'var(--vidrio2)')+'"'+(it.sel?' stroke="var(--texto)" stroke-width="1.5"':'')+'/></g>'+
      ((i%salto===0||it.sel)?'<text class="eje'+(it.sel?' sel':'')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.etq)+'</text>':'');
  }).join('');
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.etiqueta||'Gráfica de barras')+'">'+defs+g+barras+'</svg>';
  el.querySelectorAll('.colb').forEach(function(c){
    var it=items[+c.dataset.i];
    c.addEventListener('pointermove',function(ev){tip(it.tip,ev)});
    c.addEventListener('pointerleave',tipOff);
    if(o.clic)c.addEventListener('click',function(){seleccionar(it.k)});
  });
}

/* ───────── ATH Móvil ───────── */
function vistaAth(){
  if(!S.ath)return '<div class="panel sindatos">No hay carpeta de ATH Móvil para este mes.</div>';
  var d=diaDe(S.ath,S.dia);
  if(!d)return sinHoja('ath')+mesAthPanel();
  if(d.error)return '<div class="panel error"><strong>No pude leer este reporte.</strong><p>'+esc(d.error)+'</p></div>';

  var pico=d.porHora.slice().sort(function(a,b){return b.total-a.total})[0];
  var cu=diaDe(S.cuadre,d.fecha), cot='';
  if(cu&&!cu.error){var igual=cu.propinas.transaccionesATH===d.cantidad;
    cot='<span class="chip '+(igual?'ok':'rev')+'">'+(igual?'✓ Coincide con el cuadre':'Revisar: el cuadre dice '+cu.propinas.transaccionesATH)+'</span>'}
  var totalOk=d.totalHoja==null?'':'<span class="chip '+((Math.abs(d.totalHoja-d.total)<0.005&&d.cantidadHoja===d.cantidad)?'ok':'rev')+'">Hoja TOTAL: '+money(d.totalHoja)+' · '+d.cantidadHoja+'</span>';
  var hero='<section class="panel hero e" style="--i:1"><div><p class="rot">Cobrado por ATH Móvil el '+esc(fechaLarga(d.fecha))+'</p>'+
    '<p class="gran" data-cuenta="'+d.total+'">'+money(d.total)+'</p>'+
    '<span class="estado sube" style="background:rgba(43,217,196,.14);color:var(--mar)"><span data-cuenta="'+d.cantidad+'" data-fmt="int">'+d.cantidad+'</span>&nbsp;'+(d.cantidad===1?'transacción':'transacciones')+'</span>'+
    '<div class="hechos">'+cot+totalOk+'</div></div>'+
    '<div class="tiles" style="margin:0;grid-template-columns:1fr 1fr;gap:10px">'+
      mini('Promedio por transacción',money(d.promedio))+mini('La más grande',money(d.maximo))+
      mini('Hora con más cobros',pico?horaCorta(pico.h):'—')+mini('Cobrado en esa hora',pico?money(pico.total):'—')+
    '</div></section>';

  var panelHoras='<section class="panel e" style="--i:4"><h2>Cobros por hora</h2><p class="sub">Cuánto entró por ATH Móvil en cada hora</p>'+
    (d.porHora.length?'<div class="graf" data-g="horas-ath"></div>':'<p class="vacio">Sin transacciones este día.</p>')+'</section>';

  var tabla='<section class="panel e" style="--i:5"><h2>Transacciones</h2><p class="sub">Los teléfonos se muestran con solo los últimos 4 dígitos</p>'+
    '<input class="busca" id="busca" type="search" placeholder="Buscar por nombre o mensaje" value="'+esc(S.q)+'" aria-label="Buscar transacciones">'+
    '<div class="tbl"><table><thead><tr><th>Hora</th><th>Nombre</th><th>Teléfono</th><th class="der">Cantidad</th><th>Mensaje</th></tr></thead><tbody id="filas">'+filasAth(d)+'</tbody>'+
    '<tfoot><tr><td colspan="3">Total del día</td><td class="der">'+money(d.total)+'</td><td>'+d.cantidad+' transacciones</td></tr></tfoot></table></div></section>';

  return hero+alertasHtml(d)+'<div class="rejilla r21"><div style="display:grid;gap:14px">'+panelHoras+mesAthPanel(true)+'</div>'+mapaPanel()+'</div><div class="rejilla">'+tabla+'</div>';
}

function mini(et,val){return '<div class="panel tile" style="padding:12px 14px"><span class="et">'+et+'</span><span class="val" style="font-size:20px;margin-bottom:0">'+val+'</span></div>'}

function filasAth(d){
  var q=S.q.trim().toLowerCase();
  var lista=d.transacciones.filter(function(t){return !q||(t.nombre+' '+t.mensaje).toLowerCase().indexOf(q)>=0});
  if(!lista.length)return '<tr><td colspan="5" class="vacio">'+(d.transacciones.length?'Ninguna transacción coincide con la búsqueda.':'Sin transacciones este día.')+'</td></tr>';
  return lista.map(function(t){
    return '<tr><td>'+esc(t.hora)+'</td><td>'+esc(t.nombre)+'</td><td>'+esc(t.telefono)+'</td><td class="der">'+money(t.monto)+'</td><td>'+(t.mensaje?esc(t.mensaje):'<span class="vacio">—</span>')+'</td></tr>';
  }).join('');
}

function mesAthPanel(enColumna){
  var dias=buenos(S.ath); if(!dias.length)return '';
  var cc=dias.filter(function(d){return d.cantidad>0}), tot=suma(cc,function(d){return d.total}), n=suma(cc,function(d){return d.cantidad});
  var mejor=cc.slice().sort(function(a,b){return b.total-a.total})[0];
  var st=function(et,v,sub,raw){return '<div><span class="et" style="font-size:12.5px;color:var(--texto2)">'+et+'</span><strong style="display:block;font-size:22px;font-weight:600"'+(raw!=null?' data-cuenta="'+raw+'"':'')+'>'+v+'</strong>'+(sub?'<small style="color:var(--texto3)">'+sub+'</small>':'')+'</div>'};
  return '<section class="panel e" style="--i:6;'+(enColumna?'':'margin-top:14px')+'"><h2>El mes día por día</h2><p class="sub">Toca una barra para abrir ese día.</p>'+
    '<div class="tiles" style="margin:0 0 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+st('Cobrado en el mes',money(tot),'',tot)+st('Transacciones',n.toLocaleString('en-US'),'',null)+st('Promedio por transacción',money(n?tot/n:0),'',n?tot/n:0)+
      st('Mejor día',mejor?money(mejor.total):'—',mejor?esc(fechaLarga(mejor.fecha)):'',null)+'</div><div class="graf" data-g="mes-ath"></div></section>';
}

function mapaPanel(){
  var dias=buenos(S.ath).filter(function(d){return d.porHora.length});
  if(!dias.length)return '<section class="panel e" style="--i:4"><h2>Mapa de calor</h2><p class="vacio">Aún no hay cobros este mes.</p></section>';
  var h0=24,h1=0,max=1;
  dias.forEach(function(d){d.porHora.forEach(function(x){h0=Math.min(h0,x.h);h1=Math.max(h1,x.h);max=Math.max(max,x.total)})});
  h0=Math.min(h0,h1);var cols=h1-h0+1,hh='<div class="fila"><span></span>';
  for(var h=h0;h<=h1;h++)hh+='<span class="hh">'+(h%12||12)+(h<12?'a':'p')+'</span>';
  hh+='</div>';
  var filas=buenos(S.ath).map(function(d){
    var mp={};d.porHora.forEach(function(x){mp[x.h]=x});
    var s='<div class="fila"><span class="dn'+(d.fecha===S.dia?' sel':'')+'" data-act="dia" data-f="'+d.fecha+'">'+parts(d.fecha).d+'</span>';
    for(var h=h0;h<=h1;h++){var x=mp[h];
      var a=x?0.14+0.86*Math.sqrt(x.total/max):0;
      s+='<span class="celda'+(d.fecha===S.dia?' cur':'')+'" data-act="dia" data-f="'+d.fecha+'" data-h="'+h+'" data-t="'+(x?x.total:0)+'" data-n="'+(x?x.n:0)+'" style="'+(x?'background:rgba(43,217,196,'+a.toFixed(2)+')':'')+'"></span>'}
    return s+'</div>';
  }).join('');
  return '<section class="panel e" style="--i:4"><h2>Mapa de calor del mes</h2><p class="sub">Cada fila es un día; entre más claro, más se cobró en esa hora.</p>'+
    '<div class="mapa" style="--cols:'+cols+'" role="img" aria-label="Cobros de ATH Móvil por día y hora">'+hh+filas+'</div></section>';
}

function graficaHoras(el){
  var d=diaDe(S.ath,S.dia); if(!d||!d.porHora.length)return;
  var mp={},h0=d.porHora[0].h,h1=d.porHora[d.porHora.length-1].h;
  d.porHora.forEach(function(x){mp[x.h]=x});
  var items=[];
  for(var h=h0;h<=h1;h++){var x=mp[h]||{total:0,n:0};
    items.push({k:h,etq:(h%12||12)+(h<12?'a':'p'),v:x.total,tip:'<b>'+horaCorta(h)+'</b><span>Cobrado: <em>'+money(x.total)+'</em></span><span>'+x.n+' '+(x.n===1?'transacción':'transacciones')+'</span>'})}
  graficaBarras(el,items,{color:'var(--mango)',alto:250,etiqueta:'Cobros por hora'});
}

function graficaMesAth(el){
  var items=buenos(S.ath).map(function(d){
    return {k:d.fecha,etq:String(parts(d.fecha).d),v:d.total,sel:d.fecha===S.dia,
      tip:'<b>'+esc(fechaLarga(d.fecha))+'</b><span>Cobrado: <em>'+money(d.total)+'</em></span><span>'+d.cantidad+' '+(d.cantidad===1?'transacción':'transacciones')+'</span>'}});
  graficaBarras(el,items,{color:'var(--mar)',alto:250,clic:true,etiqueta:'Cobrado por día'});
}

/* ───────── Gráficas, tooltip y eventos ───────── */
function dibujarGraficas(){
  document.querySelectorAll('[data-g]').forEach(function(el){
    var g=el.dataset.g;
    if(g==='mes-cuadre')graficaMesCuadre(el); else if(g==='mes-ath')graficaMesAth(el); else if(g==='horas-ath')graficaHoras(el);
  });
}

function tip(html,ev){
  var t=$('#tip'); t.innerHTML=html; t.hidden=false;
  var w=t.offsetWidth,h=t.offsetHeight,x=ev.clientX+16,y=ev.clientY-h-14;
  if(x+w>innerWidth-8)x=ev.clientX-w-16; if(y<8)y=ev.clientY+18;
  t.style.transform='translate('+Math.max(8,x)+'px,'+y+'px)';
}
function tipOff(){var t=$('#tip');if(t)t.hidden=true}

function seleccionar(f){S.dia=f;render();if(window.scrollY>320)window.scrollTo({top:0,behavior:reducir()?'auto':'smooth'})}
function mover(delta){
  var obj=S.tab==='cuadre'?S.cuadre:S.ath; if(!obj||!obj.dias||!obj.dias.length)return;
  var f=obj.dias.map(function(x){return x.fecha}), i=f.indexOf(S.dia); if(i<0)i=f.length-1;
  S.dia=f[clamp(i+delta,0,f.length-1)]; render();
}
function cambiarTema(){
  var t=document.documentElement.dataset.tema==='oscuro'?'claro':'oscuro';
  document.documentElement.dataset.tema=t; try{localStorage.setItem('cm-tema',t)}catch(e){}
  dibujarGraficas();
}

document.addEventListener('click',function(e){
  var u=e.target.closest&&e.target.closest('.lu');
  if(u){L.id=u.dataset.u;L.pin='';pintarPin();$('#login').classList.remove('bloqueado');pintarUsuarios();estadoLogin('Escribe tu PIN.');return}
  var k=e.target.closest&&e.target.closest('.tk[data-k]');
  if(k){teclear(k.dataset.k);return}
  var t=e.target.closest&&e.target.closest('[data-tab],[data-act]'); if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.q='';ajustarDia();render();return}
  if(t.dataset.act==='dia'){seleccionar(t.dataset.f);return}
  if(t.dataset.act==='metrica'){S.metrica=t.dataset.k;document.querySelectorAll('.pill').forEach(function(p){p.setAttribute('aria-pressed',String(p.dataset.k===S.metrica))});
    var g=$('[data-g="mes-cuadre"]');if(g)graficaMesCuadre(g);return}
  if(t.dataset.act==='reintentar'){if(S.meses){cargarMes(false)}else{iniciar()}}
});
document.addEventListener('pointermove',function(e){
  var tg=e.target; if(!tg.closest)return;
  var p=tg.closest('.panel'); if(p){var r=p.getBoundingClientRect();p.style.setProperty('--mx',(e.clientX-r.left)+'px');p.style.setProperty('--my',(e.clientY-r.top)+'px')}
  var c=tg.closest('.celda');
  if(c){var h=+c.dataset.h,n=+c.dataset.n;
    tip('<b>'+esc(fechaLarga(c.dataset.f))+', '+horaCorta(h)+'</b><span>'+(n?'Cobrado: <em>'+money(+c.dataset.t)+'</em>':'Sin cobros')+'</span>'+(n?'<span>'+n+' '+(n===1?'transacción':'transacciones')+'</span>':''),e);return}
  var sg=tg.closest('.seg,.dona-leyenda li');
  var wrap=document.querySelector('.dona-wrap');
  if(wrap){var v=$('#dnV'),nn=$('#dnN');
    if(sg&&sg.dataset.i!=null){var items=wrap.querySelectorAll('.dona-leyenda li');var li_=items[+sg.dataset.i];
      document.querySelectorAll('.seg').forEach(function(s){s.classList.toggle('on',s.dataset.i===sg.dataset.i)});
      v.textContent=li_.querySelector('b').textContent;nn.textContent=li_.querySelector('span').textContent}
    else{document.querySelectorAll('.seg.on').forEach(function(s){s.classList.remove('on')});v.textContent=money(+wrap.dataset.total);nn.textContent='Total'}}
  if(!tg.closest('[data-g]'))tipOff();
});
document.addEventListener('input',function(e){
  if(e.target.id!=='busca')return;
  S.q=e.target.value; var d=diaDe(S.ath,S.dia); if(d&&$('#filas'))$('#filas').innerHTML=filasAth(d);
});
document.addEventListener('keydown',function(e){
  if(!S.token){
    if(!$('#login').hidden&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
      if(/^\d$/.test(e.key)){teclear(e.key);e.preventDefault()}else if(e.key==='Backspace'){teclear('b');e.preventDefault()}}
    return;
  }
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='ArrowLeft'){mover(-1)} else if(e.key==='ArrowRight'){mover(1)}
  else if(e.key==='1'||e.key==='2'){S.tab=e.key==='1'?'cuadre':'ath';S.q='';ajustarDia();render()}
  else if(e.key==='t'||e.key==='T'){cambiarTema()}
});
$('#mes').addEventListener('change',function(e){S.clave=e.target.value;S.dia=null;cargarMes(false)});
$('#btnActualizar').addEventListener('click',function(){cargarMes(false)});
$('#btnTema').addEventListener('click',cambiarTema);
$('#btnSalir').addEventListener('click',salir);
var _rz;window.addEventListener('resize',function(){clearTimeout(_rz);_rz=setTimeout(function(){posicionarIndicador();dibujarGraficas()},160)});
setInterval(function(){var c=$('#cuenta');if(!c||!S.proximo)return;var s=Math.max(0,Math.round((S.proximo-Date.now())/1000));c.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)},1000);
try{var tg=localStorage.getItem('cm-tema');if(tg==='claro'||tg==='oscuro')document.documentElement.dataset.tema=tg}catch(e){}
arrancar();
</script>
</body>
