<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico · Centro de mando</title>
<style>
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding:20px;background:#0f1a20;color:#e9f2f1}
main{max-width:660px;margin:0 auto}
h1{font-size:20px;margin:0 0 6px}
p{color:#9db3b3;margin:0 0 16px}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#2bd9c4;color:#04201e;font-weight:600;margin:0 8px 12px 0;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;background:#16262d;border:1px solid #2a3d45;border-radius:12px;padding:14px;font:13.5px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:0}
</style>
<script>
/* Anota qué contesta el servidor para poder explicar el fallo. Va ANTES del puente. */
window.__LOG = {};
(function () {
  var f = window.fetch;
  window.fetch = function (u, o) {
    __LOG.url = String(u);
    return f.call(window, u, o).then(function (res) {
      __LOG.status = res.status;
      __LOG.tipo = res.headers.get('content-type') || '';
      res.clone().text().then(function (t) { __LOG.cuerpo = t.slice(0, 240); });
      return res;
    }, function (err) { __LOG.errorRed = String(err); throw err; });
  };
})();
</script>
<script src="puente-centro.js"></script>
</head>
<body>
<main>
  <h1>Diagnóstico del Centro de mando</h1>
  <p>Esta página no pide PIN ni muestra datos del negocio. Solo comprueba la conexión.</p>
  <button id="probar" type="button">Probar de nuevo</button>
  <button id="copiar" type="button">Copiar resultado</button>
  <pre id="salida">Probando…</pre>
</main>
<script>
function analizar(e) {
  var L = e.log, out = [], v = '';
  out.push((e.puente ? '✓' : '✗') + ' Archivo puente-centro.js cargado');
  if (!e.puente) {
    v = 'La página no encontró puente-centro.js. Revisa que esté subido al repositorio con ese nombre exacto y en la misma carpeta que index.html.';
    return { out: out, v: v };
  }
  out.push('  Dirección que usa el puente: ' + (L.url || '(no llegó a llamar)'));
  if (L.errorRed) {
    out.push('✗ El navegador no pudo leer la respuesta (' + L.errorRed + ')');
    v = 'Casi siempre es porque la implementación activa no incluye la Versión nueva con Api.gs, o su acceso no es "Cualquier persona". En Apps Script: Implementar, Administrar implementaciones, lápiz, Versión: Versión nueva, Implementar. Si creaste una "Nueva implementación", la URL cambió y hay que ponerla en puente-centro.js.';
  } else if (L.status != null && L.status !== 200) {
    out.push('✗ El servidor contestó con error HTTP ' + L.status);
    v = 'Apps Script rechazó la llamada. Revisa que el acceso sea "Cualquier persona" y que la URL de puente-centro.js sea la de la implementación activa.';
  } else if (/html/i.test(L.tipo || '')) {
    out.push('✗ El servidor devolvió una página web en vez de datos (' + (L.tipo || '') + ')');
    if (L.cuerpo) out.push('  Texto recibido: ' + L.cuerpo.replace(/\s+/g, ' ').slice(0, 200));
    v = 'Apps Script contestó con una página, no con datos. Es el síntoma de que la implementación activa no tiene Api.gs (falta publicar una Versión nueva) o de que Api.gs tiene un error al guardarse.';
  } else if (e.resultado === 'ok') {
    out.push('✓ El servidor contestó con datos');
    out.push('✓ Usuarios recibidos: ' + e.nombres.join(', '));
    v = 'Todo bien con la conexión. Entonces el problema está en index.html: verifica que index.html tenga, dentro de la sección head, la línea que carga puente-centro.js (script src="puente-centro.js") y que el archivo se llame index.html en minúscula.';
  } else {
    out.push('✗ Respondió con un error: ' + e.mensaje);
    v = 'Copia este resultado completo y mándaselo a Claude.';
  }
  return { out: out, v: v };
}

function probar() {
  var salida = document.getElementById('salida');
  salida.textContent = 'Probando…';
  window.__LOG = {};
  var estado = { puente: !!(window.google && window.google.script && window.google.script.run), log: window.__LOG, resultado: null, mensaje: '', nombres: [] };
  function mostrar() {
    setTimeout(function () {
      var r = analizar(estado);
      salida.textContent = r.out.join('\n') + '\n\n' + r.v + '\n\nHora: ' + new Date().toLocaleString('es-PR') + '\nPágina: ' + location.href;
    }, 500);
  }
  if (!estado.puente) { mostrar(); return; }
  window.google.script.run
    .withSuccessHandler(function (d) { estado.resultado = 'ok'; estado.nombres = (d || []).map(function (u) { return u.nombre; }); mostrar(); })
    .withFailureHandler(function (err) { estado.resultado = 'error'; estado.mensaje = (err && err.message) || String(err); mostrar(); })
    .getUsuarios();
}
document.getElementById('probar').addEventListener('click', probar);
document.getElementById('copiar').addEventListener('click', function () {
  var t = document.getElementById('salida').textContent, b = this;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'Copiado'; setTimeout(function () { b.textContent = 'Copiar resultado'; }, 1500); }, function () { b.textContent = 'Selecciona el texto y cópialo'; });
});
probar();
</script>
</body>
</html>
